name: release ready

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   pull_request_target:
#     types: [ready_for_review]
# 
jobs:
  release-ready:
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit
    uses: OpenHands/release-actions/.github/workflows/release-ready.yml@main
    with:
      product-name: OpenHands Agent Canvas
      slack-channel: '#proj-agent-canvas'
